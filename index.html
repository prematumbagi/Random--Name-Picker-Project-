<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎯 Random Name Picker</h1>
        <p>Enter names and spin the wheel!</p>

        <textarea id="nameInput"
        placeholder="Enter one name per line"></textarea>

        <button id="addButton">Add Names</button>

        <h2>Student Names</h2>
        <ul id="nameList"></ul>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>

        <button id="pickButton">🎡 SPIN THE WHEEL</button>
        <button id="clearButton">Clear All</button>

        <div class="result">
            <h2>🏆 Selected Winner</h2>
            <p id="winner">Your winner will appear here!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
